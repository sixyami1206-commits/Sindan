<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🩵相性＆デート診断アプリ</title>
  <style>
    :root { --primary: #70d6ff; --accent: #ff70a6; --bg: #e8f7ff; --text: #334e68; }
    body { margin: 0; padding: 20px 10px 80px; font-family: sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 420px; background: white; border-radius: 24px; padding: 24px 18px; border: 3px solid #b8ebd0; text-align: center; box-sizing: border-box; }
    h1 { font-size: 20px; color: #2b6cb0; margin-bottom: 15px; }
    .input-group { margin-bottom: 12px; text-align: left; }
    label { display: block; font-size: 12px; font-weight: bold; color: #4a5568; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; font-size: 14px; }
    .btn { background: linear-gradient(135deg, var(--primary), #4ea8de); color: white; border: none; padding: 14px 20px; border-radius: 30px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    .result-score { font-size: 48px; font-weight: 900; color: var(--accent); margin: 10px 0; }
    .date-box { background: #fffaf0; border: 2px dashed #f6ad55; padding: 15px; border-radius: 12px; margin: 15px 0; font-weight: bold; }
    #overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🩵相性＆デート診断</h1>
    
    <div id="step-input">
      <div class="input-group"><label>あなたの名前</label><input type="text" id="my-name"></div>
      <div class="input-group"><label>性別</label><select id="my-gender"><option value="女性">女性</option><option value="男性">男性</option></select></div>
      <div class="input-group"><label>年齢</label><input type="number" id="my-age"></div>
      <div class="input-group"><label>相手の名前</label><input type="text" id="target-name"></div>
      <div class="input-group"><label>性別</label><select id="target-gender"><option value="男性">男性</option><option value="女性">女性</option></select></div>
      <div class="input-group"><label>年齢</label><input type="number" id="target-age"></div>
      <button class="btn" onclick="startSearch()">カードを探す✨</button>
    </div>

    <div id="step-cards" class="hidden">
      <p style="font-weight:bold;">カードを1枚選んでね！</p>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div style="padding:20px; background:#a0c4ff; border-radius:10px; cursor:pointer;" onclick="selectCard()">🩵</div>
        <div style="padding:20px; background:#bdb2ff; border-radius:10px; cursor:pointer;" onclick="selectCard()">✨</div>
      </div>
    </div>

    <div id="step-result" class="hidden">
      <div class="result-score" id="result-score">--%</div>
      <div class="date-box" id="date-advice"></div>
      <button class="btn" onclick="location.reload()">もう一度診断</button>
    </div>
  </div>

  <div id="overlay"><h3 id="overlay-text">処理中...</h3></div>

  <script>
    const WEBHOOK = "https://discord.com/api/webhooks/1529447601521299647/XbSfq7kLDeLB1LW-NeHwAzurzH6T-wWwVU4oAF_XoZ5HBQ4ps-zpKeD7vhX1fCq-_VY_";
    let currentData = {};

    function startSearch() {
      currentData = { names: document.getElementById('my-name').value + document.getElementById('target-name').value, genders: [document.getElementById('my-gender').value, document.getElementById('target-gender').value] };
      document.getElementById('overlay-text').innerText = "カードを探しています...";
      document.getElementById('overlay').style.display = 'flex';
      setTimeout(() => {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('step-input').classList.add('hidden');
        document.getElementById('step-cards').classList.remove('hidden');
      }, 6000);
    }

    function selectCard() {
      document.getElementById('overlay-text').innerText = "解析中...";
      document.getElementById('overlay').style.display = 'flex';
      setTimeout(() => {
        let score = 0;
        const text = currentData.names;
        if (text.includes("たくみ")) score = Math.floor(Math.random() * 51);
        else if (text.match(/アル|ある|藤井/)) score = 125 + Math.floor(Math.random() * 26);
        else if (currentData.genders[0] === currentData.genders[1]) score = 100 + Math.floor(Math.random() * 51);
        else score = 50 + Math.floor(Math.random() * 101);
        
        // デート診断ロジック
        let advice = "";
        if (score < 50) advice = "🚫 まだデートは早いかも…まずはLINEで会話を深めよう！";
        else if (score < 90) advice = "🗓 3〜5日後がおすすめ！少し余裕を持って誘ってみて。";
        else advice = "🔥 今すぐ誘うべき！今日か明日、最高のデートチャンスです！";
        
        document.getElementById('result-score').innerText = score + "%";
        document.getElementById('date-advice').innerText = advice;
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('step-cards').classList.add('hidden');
        document.getElementById('step-result').classList.remove('hidden');
        
        fetch(WEBHOOK, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({content: `診断結果: ${score}% (${advice})`}) }).catch(()=>{});
      }, 3000);
    }
  </script>
</body>
</html>
